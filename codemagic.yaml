# ============================================================
# JamTime — Codemagic CI/CD Konfigurasyonu
# ============================================================
# Iki workflow:
#   1) ios-testflight : TestFlight'a yukler (TestFlight app uzerinden kurulur)
#   2) ios-adhoc      : Ad-hoc IPA olusturur (Diawi/AltStore ile kurulur)
#
# GEREKSINIMLER (Codemagic Application-level Environment Variables):
#   Group: app_store_credentials (Secret = true)
#     APP_STORE_CONNECT_PRIVATE_KEY    -> .p8 dosyasinin TUM icerigi
#     APP_STORE_CONNECT_KEY_IDENTIFIER -> 10 karakterli Key ID
#     APP_STORE_CONNECT_ISSUER_ID      -> Issuer ID (UUID)
#     CERTIFICATE_PRIVATE_KEY          -> RSA private key (cert imzalama icin)
#   Group: spotify (Secret = true)
#     SPOTIFY_CLIENT_ID                -> Spotify uygulama client ID
#
# App Store Connect:
#   - Bundle ID: com.atamya.jamtime
#   - App Apple ID: 6770459105
#   - TestFlight Internal Tester group: "Internal Testers"
# ============================================================

workflows:

  # ============================================================
  # 1) TESTFLIGHT WORKFLOW
  # ============================================================
  ios-testflight:
    name: iOS - TestFlight Deploy
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_credentials   # APP_STORE_CONNECT_* variables
        - spotify                 # SPOTIFY_CLIENT_ID
      vars:
        BUNDLE_ID: "com.atamya.jamtime"
        APP_STORE_APPLE_ID: 6770459105
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    scripts:
      - name: Generate spotify_config.dart from env vars
        script: |
          mkdir -p lib/config
          cat > lib/config/spotify_config.dart <<EOF
          class SpotifyConfig {
            static const clientId = '$SPOTIFY_CLIENT_ID';
            static const redirectUrl = 'jamtime://callback';
            static const scopes = 'user-read-private app-remote-control streaming';
          }
          EOF
          echo "spotify_config.dart created"

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch signing files (auto-create if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Regenerate launcher icons (1024x1024 kare logo)
        script: |
          dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter analyze
        script: |
          flutter analyze || true

      - name: Flutter build ipa
        script: |
          # get-latest-build-number TUM build'leri sayar (App Store + TestFlight + reddedilenler)
          # get-latest-app-store-build-number SADECE yayinlanmis build'leri sayar
          # Apple bir kez yuklenen build numarasini tutuyor — duplicate olmasin diye
          # gercek "en yuksek" rakami almak gerekiyor.
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          BUILD_NUMBER=$(($LATEST_BUILD + 1))
          echo "Apple'daki en son build: $LATEST_BUILD"
          echo "Yeni build numarasi: $BUILD_NUMBER"

          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
        submit_to_app_store: false

      email:
        recipients:
          - a.isik@atamya.com
        notify:
          success: true
          failure: true


  # ============================================================
  # 2) AD-HOC WORKFLOW
  # ============================================================
  ios-adhoc:
    name: iOS - Ad-Hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      groups:
        - app_store_credentials
        - spotify
      vars:
        BUNDLE_ID: "com.atamya.jamtime"
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Generate spotify_config.dart from env vars
        script: |
          mkdir -p lib/config
          cat > lib/config/spotify_config.dart <<EOF
          class SpotifyConfig {
            static const clientId = '$SPOTIFY_CLIENT_ID';
            static const redirectUrl = 'jamtime://callback';
            static const scopes = 'user-read-private app-remote-control streaming';
          }
          EOF

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Fetch ad-hoc signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Regenerate launcher icons
        script: |
          dart run flutter_launcher_icons

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Flutter build ipa (ad-hoc)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - a.isik@atamya.com
        notify:
          success: true
          failure: true
